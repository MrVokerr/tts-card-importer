# Daily token metadata sync (runs on GitHub-hosted runners — not your PC).
name: R2 token sync

on:
  schedule:
    # Daily 06:00 UTC
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'R2/**'
      - '.github/workflows/r2-token-sync.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if Scryfall bulk updatedAt unchanged'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      cache_images:
        description: 'Also cache Kai-missing token JPGs to R2 /cards/{uuid}.jpg (auto-discovers recent token sets)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      image_sets:
        description: 'Optional extra Scryfall set codes (comma-separated) unioned with auto-discovery; leave empty for auto-only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  sync-tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: R2

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: R2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync token metadata to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          EXTRA=""
          if [ "$INPUT_FORCE" = "true" ]; then
            EXTRA="--force"
          fi
          node scripts/sync-tokens.js $EXTRA

      - name: Cache Kai-missing token images
        # schedule/push always cache; workflow_dispatch can disable via cache_images=false
        if: >-
          success() && (
            github.event_name == 'schedule' ||
            github.event_name == 'push' ||
            github.event.inputs.cache_images != 'false'
          )
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          INPUT_SETS: ${{ github.event.inputs.image_sets }}
        run: |
          # Auto-discover token sets in window; image_sets are optional extras (not a hard-coded default).
          # Inputs arrive through env (not pasted into the script) and set codes must be letters/digits.
          SETS="$INPUT_SETS"
          if [ -n "$SETS" ] && ! printf '%s' "$SETS" | grep -Eq '^[A-Za-z0-9]+(,[A-Za-z0-9]+)*$'; then
            echo "::error::image_sets must be comma-separated set codes"; exit 1
          fi
          EXTRA=""
          if [ -n "$SETS" ]; then
            EXTRA="--sets=$SETS"
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            EXTRA="$EXTRA --force"
          fi
          node scripts/cache-token-images.js $EXTRA

      - name: Verify public CDN
        if: success()
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          # Fallback is the public R2 CDN (pub-*.r2.dev), not a credential.
          # Prefer R2_PUBLIC_BASE_URL when set (custom domain / production CDN).
          BASE="${R2_PUBLIC_BASE_URL:-https://pub-6c935b50ab2c43f291df08b7f566585b.r2.dev}"
          npm run verify -- --base-url="$BASE"
